.simple-deploy:
  stage: deploy
  cache:
    policy: pull
  extends:
    - .image-amd64
    - .gitlab-runner-tag
  variables:
    MAKE_TARGET: deploy-snapshot
  script:
    - make ${MAKE_TARGET}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Release with semantic version
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        MAKE_TARGET: deploy-release
    # Release-Candidate with semantic version and suffix
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-.+$/'
      variables:
        MAKE_TARGET: deploy-rc
    - when: on_success
  # For now the tags need to be set hard-coded to prevent issues with variables and trigger events
  tags:
    - tqem-deploy

.deploy-snapshot:
  stage: deploy
  cache:
    policy: pull
  extends:
    - .image-amd64
    - .gitlab-runner-tag
    - .rule-include-default-branch
  variables:
    MAKE_TARGET: deploy-snapshot
  script:
    - make ${MAKE_TARGET}
  # For now the tags need to be set hard-coded to prevent issues with variables and trigger events
  tags:
    - tqem-deploy-snapshots
